# Development overlay: live-reload for every service on file change.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Invoking with explicit -f bypasses docker-compose.override.yml, so the
# Apple-Silicon db image and loopback port publishing from there are repeated
# below to keep this a self-contained dev stack. Each app service bind-mounts its
# source and runs a watcher (air / uvicorn --reload / astro dev) instead of the
# baked production binary.
services:
  db:
    # Community multi-arch mirror so Postgres runs natively on arm64 Macs.
    image: imresamu/postgis:18-3.6
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"

  gribsvc:
    build:
      context: ../gribsvc
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - gribdata:/data
      - ../gribsvc/app:/app/app

  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - .:/app
      - gribdata:/data
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod

  web:
    build:
      context: ../web
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:4321:4321"
    # --force replaces a stale .astro/dev.json lock left by a previous container
    # (its PID is gone but the file persists via the bind mount below).
    command: npm run dev -- --force
    volumes:
      - ../web:/app
      # Keep the image's installed deps; don't let the bind mount shadow them.
      - /app/node_modules

volumes:
  go-build-cache:
  go-mod-cache:
