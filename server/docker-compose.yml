services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-weather}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-weather}"
      POSTGRES_DB: "${POSTGRES_DB:-weather}"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  gribsvc:
    build: ../gribsvc
    restart: unless-stopped
    environment:
      GRIB_DATA_DIR: /data
      PORT: "9090"
    volumes:
      - gribdata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:9090/health'').status==200 else 1)"',
        ]
      # Probe rapidly only until first healthy (clears the server's depends_on
      # gate fast), then settle to an infrequent steady-state check — nothing
      # reacts to gribsvc going unhealthy after startup, so this is just a
      # liveness signal.
      start_period: 15s
      start_interval: 2s
      interval: 30m
      timeout: 3s
      retries: 3

  server:
    build: .
    restart: unless-stopped
    environment:
      PORT: "${PORT:-8080}"
      GOMEMLIMIT: "${GOMEMLIMIT:-512MiB}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD:-weather}@db:5432/${POSTGRES_DB:-weather}?sslmode=disable"
      FMI_BASE_URL: "${FMI_BASE_URL:-https://opendata.fmi.fi/wfs}"
      FMI_API_KEY: "${FMI_API_KEY:-}"
      FMI_TIMESERIES_URL: "${FMI_TIMESERIES_URL:-https://data.fmi.fi}"
      FMI_DOWNLOAD_URL: "${FMI_DOWNLOAD_URL:-https://opendata.fmi.fi/download}"
      GRIBSVC_URL: "${GRIBSVC_URL:-http://gribsvc:9090}"
      GRIB_DATA_DIR: /data
      GRIB_FETCH_ENABLE: "${GRIB_FETCH_ENABLE:-}"
      RADAR_FETCH_ENABLE: "${RADAR_FETCH_ENABLE:-}"
      CLIENT_SECRETS: "${CLIENT_SECRETS:?CLIENT_SECRETS must be set}"
      REQUEST_SIGNATURE_MAX_AGE_SECONDS: "${REQUEST_SIGNATURE_MAX_AGE_SECONDS:-300}"
    volumes:
      - gribdata:/data
    depends_on:
      db:
        condition: service_healthy
      gribsvc:
        condition: service_healthy

  web:
    build: ../web
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      WBY_API_BASE_URL: "http://server:${PORT:-8080}"
      WBY_API_CLIENT_ID: "${WBY_API_CLIENT_ID:-web}"
      WBY_API_CLIENT_SECRET: "${WBY_API_CLIENT_SECRET:?WBY_API_CLIENT_SECRET must be set}"
      WBY_CACHE_TTL_SECONDS: "${WBY_CACHE_TTL_SECONDS:-900}"
      WBY_CACHE_STALE_SECONDS: "${WBY_CACHE_STALE_SECONDS:-3600}"
    depends_on:
      - server

volumes:
  pgdata:
  gribdata:
