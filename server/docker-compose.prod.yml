# Production overlay: attach the public-facing services to the shared `edge`
# network so the host-wide Caddy (in ../infra) can reach them. Publishes no host
# ports — Caddy is the only ingress.
#
#   docker compose -p wby -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# `edge` is created out of band: `docker network create edge`.
services:
  # Cap gribsvc so a runaway extract burst is OOM-killed in its cgroup (and
  # restarted via `restart: unless-stopped`) instead of thrashing the whole VPS.
  # memswap_limit == mem_limit keeps it out of swap if the host ever gains one.
  # The CPU cap leaves the host's other core to the API server and Postgres
  # while the 5-minute nowcast/warm cycle runs.
  gribsvc:
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0

  server:
    networks:
      # Keep the default network (to reach db + gribsvc privately)...
      default: {}
      # ...and join edge under a globally unique alias for Caddy.
      edge:
        aliases:
          - weather-api

  web:
    networks:
      default: {}
      edge:
        aliases:
          - weather-web

networks:
  edge:
    external: true
