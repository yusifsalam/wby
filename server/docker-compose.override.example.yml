# Local-only overrides (gitignored — copy to docker-compose.override.yml).
# Compose auto-merges this on top of docker-compose.yml for `docker compose`
# runs in this directory.
#
# The base compose publishes no host ports (production reaches services over the
# shared `edge` network via Caddy). Locally we hit them directly, so this overlay
# publishes them — bound to loopback so they aren't exposed on the network.
services:
  db:
    # postgis/postgis is published amd64-only; on Apple Silicon use the community
    # multi-arch mirror so Postgres runs natively on arm64 instead of under
    # emulation. Production (amd64 VPS) keeps the official image.
    image: imresamu/postgis:18-3.6
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"

  server:
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"

  # Publish the containerized gribsvc for local inspection (curl localhost:9091).
  # 9091 avoids clashing with a host-run gribsvc on 9090.
  gribsvc:
    ports:
      - "127.0.0.1:9091:9090"

  web:
    ports:
      - "127.0.0.1:4321:4321"
